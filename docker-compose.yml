services:
  netbird:
      image: netbirdio/netbird:0.63.0
      container_name: netbird
      hostname: worker1
      restart: unless-stopped
      command:
          - up
          - --allow-server-ssh
          - --enable-ssh-root
      cap_add:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
      network_mode: host
      environment:
          - NB_SETUP_KEY=${NB_SETUP_KEY}
      volumes:
          - ./config:/etc/netbird
          - ./data:/var/lib/netbird
